<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type Racer</title>
<style>
:root{--bg:#e9e8e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1020;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
canvas{height:100%;max-height:100%;max-width:100%;aspect-ratio:280/540;image-rendering:pixelated;cursor:default}
</style></head><body>
<canvas id="c" width="560" height="1080" tabindex="0" aria-label="Type Racer game. Choose a difficulty with keys 1, 2, or 3, then type the displayed words to steer."></canvas>
<script>
const canvas=document.getElementById('c');
const context=canvas.getContext('2d');
context.scale(2,2);

const WIDTH=280,HEIGHT=540,ROAD_TOP=40,ROAD_BOTTOM=450,CAR_TOP=368;
const LANE_X=[66.67,140,213.33];
const FONT='ui-monospace,Menlo,Consolas,"Courier New",monospace';
const BUILDING_HEIGHTS=[68,90,74,96,62];
const LEFT_BUILDINGS=['#b13e53','#3b5dc9','#5d275d','#257179','#b13e53'];
const RIGHT_BUILDINGS=['#257179','#5d275d','#3b5dc9','#b13e53','#3b5dc9'];
const DIFFICULTIES=[
  {name:'EASY',description:'3-letter words',color:'#73eff7'},
  {name:'MEDIUM',description:'Mostly 4, some 5 letters',color:'#ffcd75'},
  {name:'HARD',description:'5 and 6-letter words',color:'#ef7d57'}
];
const DIFFICULTY_BUTTONS=DIFFICULTIES.map((_,index)=>[40,190+index*64,200,52]);
const splitWords=words=>words.split(' ');
const wordsByLength={
  3:splitWords('cat dog sun sky fox car bus map pen cup hat bed toy red box fan jam kid log mud nut owl pig rug sit tip van web yes zip ant bat'),
  4:splitWords('star moon road fast jump coin race wind fire gold blue tree rock lake bird fish cake game hand idea kite lamp milk nest park rain sand time wolf yard zone'),
  5:splitWords('speed track light drive cloud storm river table magic happy tiger zebra plant money horse queen smile brave flame ocean pilot sunny dance apple bread'),
  6:splitWords('rocket planet garden silver yellow orange monkey winter summer bridge engine castle dragon pirate hunter button camera candle circle coffee flower forest friend guitar island jacket')
};

const state={
  phase:'start',difficulty:1,score:0,bestScore:0,lane:1,carX:140,coins:[],
  leftWord:'',rightWord:'',activeWord:null,typedLength:0,recentWords:[],
  runTime:0,clock:0,scroll:0,distanceSinceTrail:0,nextTrailDistance:60,
  errorFlash:0,speedNotice:0,lastSpeed:1,lastFrame:0,crashDirection:0,crashTime:0
};

function wordFrequency(entry){
  return +(entry.tags?.find(tag=>tag.startsWith('f:'))?.slice(2)||0);
}

async function fetchWords(length){
  const pattern=encodeURIComponent('?'.repeat(length));
  const response=await fetch(`https://api.datamuse.com/words?sp=${pattern}&md=f&max=1000`,{
    signal:AbortSignal.timeout(4000)
  });
  if(!response.ok)throw Error(response.status);
  const entries=await response.json();
  const exactWord=new RegExp(`^[a-z]{${length}}$`);
  return [...new Set(entries
    .filter(entry=>exactWord.test(entry.word))
    .sort((a,b)=>wordFrequency(b)-wordFrequency(a))
    .map(entry=>entry.word))].slice(0,200);
}

async function loadWords(){
  await Promise.all([3,4,5,6].map(async length=>{
    try{
      const words=await fetchWords(length);
      if(words.length>=25)wordsByLength[length]=words;
    }catch{
      // Built-in words keep the game playable offline.
    }
  }));
}

const wordsReady=loadWords();
const pickRandom=items=>items[Math.random()*items.length|0];

function pickDifficultyWord(){
  if(state.difficulty===0)return pickRandom(wordsByLength[3]);
  if(state.difficulty===1)return pickRandom(wordsByLength[Math.random()<.2?5:4]);
  return pickRandom(wordsByLength[Math.random()<.5?5:6]);
}

function pickUnusedWord(){
  let word;
  do word=pickDifficultyWord(); while(state.recentWords.includes(word));
  return word;
}

function replaceWords(){
  do{
    state.leftWord=pickUnusedWord();
    state.rightWord=pickUnusedWord();
  }while(state.leftWord[0]===state.rightWord[0]);
  state.recentWords.push(state.leftWord,state.rightWord);
  if(state.recentWords.length>12)state.recentWords.splice(0,state.recentWords.length-12);
}

function resetTyping(){
  state.activeWord=null;
  state.typedLength=0;
}

async function startGame(difficulty){
  state.phase='loading';
  await wordsReady;
  Object.assign(state,{
    phase:'play',difficulty,score:0,lane:1,carX:140,coins:[],runTime:0,scroll:0,
    distanceSinceTrail:0,nextTrailDistance:60,errorFlash:0,speedNotice:0,lastSpeed:1
  });
  resetTyping();
  replaceWords();
}

function crash(direction){
  state.phase='over';
  state.crashDirection=direction;
  state.crashTime=0;
  state.errorFlash=0;
  state.bestScore=Math.max(state.bestScore,state.score);
  resetTyping();
}

function changeLane(direction){
  if(state.lane+direction<0||state.lane+direction>2){
    crash(direction);
    return;
  }
  state.lane+=direction;
  resetTyping();
  replaceWords();
}

function handleTypedLetter(letter){
  const words=[state.leftWord,state.rightWord];
  if(state.activeWord!==null){
    if(words[state.activeWord][state.typedLength]===letter){
      state.typedLength++;
      if(state.typedLength===words[state.activeWord].length)changeLane(state.activeWord?1:-1);
    }else{
      resetTyping();
      state.errorFlash=.2;
    }
    return;
  }
  for(let side=0;side<2;side++){
    if(words[side][0]===letter){
      state.activeWord=side;
      state.typedLength=1;
      return;
    }
  }
  state.errorFlash=.2;
}

function handleKeyDown(event){
  if(event.ctrlKey||event.metaKey||event.altKey)return;
  const key=event.key.toLowerCase();
  if(state.phase==='start'){
    if(/^[123]$/.test(key))startGame(+key-1);
    return;
  }
  if(state.phase==='over'&&state.crashTime>.7){
    if(/^[123]$/.test(key))startGame(+key-1);
    else if(key==='enter'||key===' ')startGame(state.difficulty);
    return;
  }
  if(state.phase==='play'&&/^[a-z]$/.test(key))handleTypedLetter(key);
}

function handleCanvasClick(event){
  if(state.phase!=='start'&&!(state.phase==='over'&&state.crashTime>.7))return;
  const bounds=canvas.getBoundingClientRect();
  const x=(event.clientX-bounds.left)/bounds.width*WIDTH;
  const y=(event.clientY-bounds.top)/bounds.height*HEIGHT;
  DIFFICULTY_BUTTONS.forEach((button,index)=>{
    if(x>=button[0]&&x<=button[0]+button[2]&&y>=button[1]&&y<=button[1]+button[3])startGame(index);
  });
}

addEventListener('keydown',handleKeyDown);
canvas.addEventListener('click',handleCanvasClick);

function spawnCoinTrail(){
  const lane=Math.random()*3|0;
  const count=3+(Math.random()*3|0);
  for(let index=0;index<count;index++)state.coins.push({lane,y:ROAD_TOP-index*36});
  state.distanceSinceTrail=0;
  state.nextTrailDistance=count*36+60+Math.random()*100;
}

function fill(color,x,y,width,height){
  context.fillStyle=color;
  context.fillRect(x,y,width,height);
}

function text(value,x,y,size,color,align='center'){
  context.font=`bold ${size}px ${FONT}`;
  context.fillStyle=color;
  context.textAlign=align;
  context.textBaseline='alphabetic';
  context.fillText(value,x,y);
}

function triangle(points,color){
  context.fillStyle=color;
  context.beginPath();
  context.moveTo(points[0],points[1]);
  context.lineTo(points[2],points[3]);
  context.lineTo(points[4],points[5]);
  context.fill();
}

function drawWheel(x,y,angle){
  context.save();
  context.translate(x,y);
  context.rotate(angle*Math.PI/180);
  context.strokeStyle='#f4f4f4';
  context.lineWidth=3;
  context.beginPath();
  context.arc(0,0,9,0,7);
  context.moveTo(-9,0);
  context.lineTo(9,0);
  context.moveTo(0,0);
  context.lineTo(0,9);
  context.stroke();
  fill('#f4f4f4',-2,-2,4,4);
  context.restore();
}

function drawBuildings(x,colors,offset){
  for(const startY of [ROAD_TOP+offset,ROAD_TOP+offset-410]){
    let y=startY;
    for(let index=0;index<5;index++){
      const height=BUILDING_HEIGHTS[index];
      fill(colors[index],x,y,26,height);
      context.fillStyle=x?'#73eff7':'#ffcd75';
      for(let row=y+8;row+9<=y+height;row+=18){
        context.fillRect(x+5,row,5,5);
        context.fillRect(x+15,row,5,5);
      }
      y+=height+4;
    }
  }
}

function drawCar(x,showSkids){
  const y=CAR_TOP;
  if(showSkids){
    fill('#161a2b',x-20,y+56,4,12);
    fill('#161a2b',x-20,y+72,4,10);
    fill('#161a2b',x+16,y+56,4,12);
    fill('#161a2b',x+16,y+72,4,10);
  }
  for(const [offsetX,offsetY] of [[-21,6],[15,6],[-21,40],[15,40]])fill('#0f1020',x+offsetX,y+offsetY,6,14);
  fill('#b13e53',x-16,y,32,60);
  fill('#f4f4f4',x-3,y,6,60);
  fill('#73eff7',x-12,y+16,24,12);
  fill('#73eff7',x-12,y+42,24,8);
  fill('#ffcd75',x-14,y-3,6,4);
  fill('#ffcd75',x+8,y-3,6,4);
}

function drawRoad(){
  fill('#333c57',30,ROAD_TOP,220,410);
  fill('#94b0c2',26,ROAD_TOP,4,410);
  fill('#94b0c2',250,ROAD_TOP,4,410);
  const buildingOffset=state.scroll%410;
  drawBuildings(0,LEFT_BUILDINGS,buildingOffset);
  drawBuildings(254,RIGHT_BUILDINGS,buildingOffset);
  for(const laneLineX of [103,177]){
    for(let y=ROAD_TOP-42+state.scroll%42;y<ROAD_BOTTOM;y+=42)fill('#f4f4f4',laneLineX-1,y,3,22);
  }
}

function drawCoins(){
  for(const coin of state.coins){
    const x=Math.round(LANE_X[coin.lane]);
    const y=Math.round(coin.y);
    fill('#ffcd75',x-5,y-7,10,14);
    fill('#ffcd75',x-7,y-5,14,10);
    fill('#ef7d57',x-2,y-4,4,8);
  }
}

function drawCrash(){
  const shake=state.crashTime<.6?(Math.random()*6-3|0):0;
  const burstX=Math.round(state.carX)+state.crashDirection*20;
  drawCar(Math.round(state.carX)+shake,false);
  if(state.crashTime<.6){
    fill('#ff5c5c',burstX-6,CAR_TOP+20,12,12);
    fill('#ffcd75',burstX-3,CAR_TOP+17,6,18);
    fill('#f4f4f4',burstX-10,CAR_TOP+24,20,4);
  }
}

function drawHeader(){
  fill('#29366f',0,0,WIDTH,40);
  for(const y of [11,18,25])fill('#f4f4f4',12,y,16,3);
  text('SCORE',140,15,11,'#94b0c2');
  text(String(state.score).padStart(4,'0'),140,35,20,'#f4f4f4');
  text(DIFFICULTIES[state.difficulty].name,268,25,12,'#ffcd75','right');
}

function drawWordBox(side){
  const boxX=side?148:10;
  const word=side?state.rightWord:state.leftWord;
  fill('#29366f',boxX,476,122,48);
  context.lineWidth=2;
  context.strokeStyle=state.errorFlash>0?'#ff5c5c':side?'#ffcd75':'#73eff7';
  context.strokeRect(boxX+1,477,120,46);
  if(side){
    triangle([250,492,260,500,250,508],'#ffcd75');
    drawWheel(236,500,25);
  }else{
    triangle([26,492,16,500,26,508],'#73eff7');
    drawWheel(44,500,-25);
  }
  const centerX=side?188:93;
  const spacing=word.length>5?12:14;
  const fontSize=word.length>5?17:20;
  const startX=centerX-word.length*spacing/2+spacing/2;
  for(let index=0;index<word.length;index++){
    const color=state.activeWord===side&&index<state.typedLength?'#a7f070':'#f4f4f4';
    text(word[index].toUpperCase(),startX+index*spacing,507,fontSize,color);
  }
}

function drawControls(){
  fill('#1a1c2c',0,450,WIDTH,90);
  fill('#566c86',0,450,WIDTH,3);
  drawWordBox(0);
  drawWordBox(1);
}

function drawDifficultyButtons(){
  DIFFICULTY_BUTTONS.forEach((button,index)=>{
    const difficulty=DIFFICULTIES[index];
    fill('#29366f',button[0],button[1],button[2],button[3]);
    context.lineWidth=2;
    context.strokeStyle=difficulty.color;
    context.strokeRect(button[0]+1,button[1]+1,button[2]-2,button[3]-2);
    text(`${index+1}  ${difficulty.name}`,140,button[1]+22,15,'#f4f4f4');
    text(difficulty.description,140,button[1]+40,11,'#94b0c2');
  });
}

function drawOverlay(){
  const showOverlay=state.phase==='start'||state.phase==='loading'||state.phase==='over'&&state.crashTime>.7;
  if(!showOverlay)return;
  fill('rgba(15,16,32,.85)',0,ROAD_TOP,WIDTH,410);
  if(state.phase==='loading'){
    text('LOADING WORDS...',140,250,16,'#73eff7');
    return;
  }
  if(state.phase==='over'){
    text('CRASH!',140,100,28,'#ff5c5c');
    text(`SCORE ${state.score}  BEST ${state.bestScore}`,140,132,13,'#f4f4f4');
    text('Pick a level to race again',140,160,12,'#94b0c2');
  }else{
    text('TYPE RACER',140,120,26,'#ffcd75');
    text('Type the words to steer',140,148,12,'#94b0c2');
  }
  drawDifficultyButtons();
  text('Press 1, 2 or 3',140,420,12,'#94b0c2');
}

function render(){
  const speed=1+.5*Math.floor(state.runTime/90);
  fill('#1a1c2c',0,0,WIDTH,HEIGHT);
  context.save();
  context.beginPath();
  context.rect(0,ROAD_TOP,WIDTH,ROAD_BOTTOM-ROAD_TOP);
  context.clip();
  drawRoad();
  drawCoins();
  if(state.phase==='over')drawCrash();
  else drawCar(Math.round(state.carX),Math.floor(state.clock/.3)%2===0);
  if(state.speedNotice>0)text(`SPEED x${speed.toFixed(1)}`,140,100,14,'#73eff7');
  context.restore();
  drawHeader();
  drawControls();
  drawOverlay();
  context.lineWidth=4;
  context.strokeStyle='#566c86';
  context.strokeRect(2,2,WIDTH-4,HEIGHT-4);
}

function update(deltaTime){
  const running=state.phase==='play';
  state.clock+=deltaTime;
  if(running)state.runTime+=deltaTime;
  const speed=1+.5*Math.floor(state.runTime/90);
  if(speed>state.lastSpeed){
    state.speedNotice=1.5;
    state.lastSpeed=speed;
  }
  const scrollSpeed=(running?140:state.phase==='over'?0:70)*speed*deltaTime;
  state.scroll+=scrollSpeed;
  if(state.phase==='over'){
    state.crashTime+=deltaTime;
    state.carX+=(LANE_X[state.lane]+state.crashDirection*24-state.carX)*Math.min(1,deltaTime*20);
  }
  if(!running)return;
  state.distanceSinceTrail+=scrollSpeed;
  if(state.distanceSinceTrail>=state.nextTrailDistance)spawnCoinTrail();
  state.carX+=(LANE_X[state.lane]-state.carX)*Math.min(1,deltaTime*14);
  state.coins.forEach(coin=>coin.y+=scrollSpeed);
  state.coins=state.coins.filter(coin=>{
    if(coin.y>ROAD_BOTTOM+10)return false;
    if(Math.abs(coin.y-(CAR_TOP+30))<24&&Math.abs(state.carX-LANE_X[coin.lane])<26){
      state.score+=10;
      return false;
    }
    return true;
  });
  state.errorFlash=Math.max(0,state.errorFlash-deltaTime);
  state.speedNotice=Math.max(0,state.speedNotice-deltaTime);
}

function frame(timestamp){
  const deltaTime=Math.min(.05,(timestamp-state.lastFrame)/1000||0);
  state.lastFrame=timestamp;
  update(deltaTime);
  render();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body></html>
